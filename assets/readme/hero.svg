<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ListenToMe</title>
  <desc id="hero-desc">A native Android podcast player: add RSS feeds, queue and download episodes, and play them back, shown next to a mock now-playing screen.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1E3D"/>
      <stop offset="1" stop-color="#0B294F"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B65D9"/>
      <stop offset="1" stop-color="#8FB4F5"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9C7FF"/>
      <stop offset="1" stop-color="#3E7BFA"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>

  <!-- faint waveform texture -->
  <g opacity="0.18" stroke="#A9C7FF" stroke-width="2" stroke-linecap="round">
    <line x1="40" y1="330" x2="40" y2="350"/>
    <line x1="56" y1="315" x2="56" y2="350"/>
    <line x1="72" y1="335" x2="72" y2="350"/>
    <line x1="88" y1="300" x2="88" y2="350"/>
    <line x1="104" y1="320" x2="104" y2="350"/>
    <line x1="120" y1="340" x2="120" y2="350"/>
    <line x1="136" y1="310" x2="136" y2="350"/>
    <line x1="152" y1="330" x2="152" y2="350"/>
    <line x1="168" y1="295" x2="168" y2="350"/>
    <line x1="184" y1="325" x2="184" y2="350"/>
    <line x1="200" y1="338" x2="200" y2="350"/>
  </g>

  <!-- Left: title block -->
  <text x="64" y="108" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#8FB4F5">ANDROID · PODCAST PLAYER</text>

  <text x="62" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">ListenToMe</text>

  <text x="64" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="400" fill="#D3E3FD">Add any RSS feed. Queue, download, and play —</text>
  <text x="64" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="400" fill="#D3E3FD">no account, no ads, no tracking.</text>

  <!-- feature chips -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#0B1E3D">
    <rect x="64" y="290" width="128" height="40" rx="20" fill="#A9C7FF"/>
    <text x="128" y="315" text-anchor="middle">RSS feeds</text>

    <rect x="202" y="290" width="150" height="40" rx="20" fill="#A9C7FF"/>
    <text x="277" y="315" text-anchor="middle">Downloads</text>

    <rect x="362" y="290" width="106" height="40" rx="20" fill="#A9C7FF"/>
    <text x="415" y="315" text-anchor="middle">Queue</text>

    <rect x="478" y="290" width="152" height="40" rx="20" fill="#A9C7FF"/>
    <text x="554" y="315" text-anchor="middle">OPML import</text>
  </g>

  <!-- Right: now-playing phone mock -->
  <g transform="translate(870,30)">
    <rect x="0" y="0" width="270" height="320" rx="28" fill="#0F2A52" stroke="#3E5C94" stroke-width="2"/>
    <rect x="10" y="10" width="250" height="300" rx="20" fill="#132F5C"/>

    <!-- artwork -->
    <rect x="26" y="26" width="218" height="150" rx="12" fill="url(#art)"/>
    <circle cx="135" cy="101" r="34" fill="#0F2A52" opacity="0.35"/>
    <path d="M124 84 L124 118 L152 101 Z" fill="#FFFFFF" opacity="0.9"/>

    <!-- title/meta -->
    <rect x="26" y="188" width="150" height="12" rx="6" fill="#D3E3FD"/>
    <rect x="26" y="206" width="100" height="10" rx="5" fill="#7C97C4"/>

    <!-- progress bar -->
    <rect x="26" y="232" width="218" height="6" rx="3" fill="#26417A"/>
    <rect x="26" y="232" width="140" height="6" rx="3" fill="url(#progress)"/>
    <text x="26" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#8FB4F5">18:42</text>
    <text x="244" y="256" text-anchor="end" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" fill="#8FB4F5">41:05</text>

    <!-- transport controls -->
    <g fill="#D3E3FD">
      <path d="M78 288 l-14 10 14 10 z"/>
      <rect x="55" y="288" width="4" height="20"/>
      <circle cx="135" cy="298" r="18" fill="#A9C7FF"/>
      <path d="M129 289 L129 307 L145 298 Z" fill="#0B1E3D"/>
      <path d="M192 288 l14 10 -14 10 z"/>
      <rect x="211" y="288" width="4" height="20"/>
    </g>
  </g>
</svg>
